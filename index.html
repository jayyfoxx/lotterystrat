<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Strategy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Lottery Strategy</h1>
        <div class="controls">
            <label>
                <input type="radio" name="gameType" value="pick3" checked onchange="toggleGrids()"> Pick Three
            </label>
            <label>
                <input type="radio" name="gameType" value="pick4" onchange="toggleGrids()"> Pick Four
            </label>
        </div>
        <div class="grids">
            <div class="grid" id="inputGrid">
                <h2>Input Numbers</h2>
                <div class="numbers" id="inputNumbers"></div>
            </div>
            <div class="grid" id="mirrorGrid">
                <h2>Mirror Numbers</h2>
                <div class="numbers" id="mirrorNumbers"></div>
            </div>
        </div>
        <div class="controls">
            <button onclick="generateNumbers()">Generate</button>
        </div>
        <div id="results">
            <h2>Results</h2>
            <div id="generatedResults"></div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>

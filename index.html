<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery Strategy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Lottery Strategy</h1>

        <div class="mode-switch">
            <label>
                <input type="radio" name="gameType" value="3" checked>
                Pick Three
            </label>
            <label>
                <input type="radio" name="gameType" value="4">
                Pick Four
            </label>
        </div>

        <div class="top-controls">
            <button id="clearTopBtn" type="button" class="clear-btn">Clear</button>
        </div>

        <div class="boards">
            <div class="board">
                <h2>Your Numbers</h2>
                <div class="grid" id="inputGrid"></div>
            </div>
            <div class="board">
                <h2>Mirror Numbers</h2>
                <div class="grid" id="mirrorGrid"></div>
            </div>
            <div class="board">
                <h2>Flip Numbers</h2>
                <div class="grid" id="flipGrid"></div>
            </div>
        </div>

        <div class="bottom-controls">
            <button id="generateBtn" type="button">Generate</button>
            <button id="clearBottomBtn" type="button" class="clear-btn">Clear</button>
        </div>

        <div id="results"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
